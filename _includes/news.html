{% capture content %}
<table class="news-table">
    {% for note in include.news %}
    <tr>
        <td class="news-date"><strong>{% if
                note.display_date %}{{
                note.display_date }}{% else %}{{ note.date | date: "%B %Y" }}{% endif %}</strong></td>
        <td class="news-item">{{ note.item }}</td>
    </tr>
    {% endfor %}
</table>
{% endcapture %}

{{ content | markdownify }}
